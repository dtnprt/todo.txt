[package]
name = "todotxt"
version = "0.1.0"
description = "todo.txt desktop app"
edition = "2021"

[lib]
name = "todotxt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
git2 = "0.21"
auth-git2 = "0.6"
