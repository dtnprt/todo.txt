# Builds the desktop installers, the terminal app and the web app and publishes them as a GitHub release.
# Runs on every push to main (the version comes from the VERSION file: ./build.ps1 counts it up with every build commit) and
# can be started by hand. A release v<VERSION> is only created once: pushes without a new VERSION do nothing.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: create the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
      id: ${{ steps.v.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists already: nothing to do"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "todo.txt $version" --prerelease \
              --notes "Automatic build of commit ${GITHUB_SHA::7}. Vibe-coded with Claude Code: expect rough edges. Encryption is experimental."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)" >> "$GITHUB_OUTPUT"

  desktop:
    name: desktop (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: linux
            os: ubuntu-22.04
            args: ""
          - name: macos-arm64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          releaseId: ${{ needs.release.outputs.id }}
          args: ${{ matrix.args }}

  terminal:
    name: terminal app (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: "", exe: todo.exe }
          - { name: linux-x64, os: ubuntu-22.04, target: "", exe: todo }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, exe: todo }
          - { name: macos-x64, os: macos-15-intel, target: x86_64-apple-darwin, exe: todo }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Linux packages
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsecret-1-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: build
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --manifest-path cli/Cargo.toml --target "${{ matrix.target }}"
            out="cli/target/${{ matrix.target }}/release"
          else
            cargo build --release --manifest-path cli/Cargo.toml
            out="cli/target/release"
          fi
          mkdir -p dist
          cp "$out/${{ matrix.exe }}" dist/
          cp README.md LICENSE dist/
          v="${{ needs.release.outputs.version }}"
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            7z a "../todo-cli-$v-${{ matrix.name }}.zip" .
            echo "asset=todo-cli-$v-${{ matrix.name }}.zip" >> "$GITHUB_ENV"
          else
            tar czf "../todo-cli-$v-${{ matrix.name }}.tar.gz" .
            echo "asset=todo-cli-$v-${{ matrix.name }}.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ env.asset }}" --clobber

  web:
    name: web app
    needs: release
    if: needs.release.outputs.exists != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.release.outputs.version }}"
          (cd web && zip -r "../todotxt-web-$v.zip" . -x 'test/*' 'package.json' 'version.json')
          gh release upload "${{ needs.release.outputs.tag }}" "todotxt-web-$v.zip" --clobber

  android:
    name: android app (arm64 apk)
    needs: release
    if: needs.release.outputs.exists != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: build the apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: cargo tauri android build --apk --target aarch64
      - name: sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          # Repository secrets (Settings -> Secrets and variables -> Actions): the release keystore, base64 encoded, and its passwords.
          # Without them a throw-away key is used: the apk installs, but every build has a different signature (no updates over an older one).
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          v="${{ needs.release.outputs.version }}"
          unsigned="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)"
          echo "built: $unsigned"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            ks_pass="$KEYSTORE_PASSWORD"; alias="$KEY_ALIAS"; key_pass="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret: signing with a throw-away key"
            ks_pass=android; alias=todotxt; key_pass=android
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -storepass "$ks_pass" -keypass "$key_pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=todo.txt"
          fi
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass "pass:$ks_pass" --ks-key-alias "$alias" --key-pass "pass:$key_pass" \
            --out "todotxt-$v-android.apk" "$unsigned"
          "$apksigner" verify "todotxt-$v-android.apk"
          gh release upload "${{ needs.release.outputs.tag }}" "todotxt-$v-android.apk" --clobber
